services:
  - type: web
    name: vaksiddhi-acoustic-api
    runtime: python
    repo: https://github.com/nidhi-kn/vaksiddhi-acoustic
    branch: render-deployment
    plan: 1c-2g
    autoDeployTrigger: "off"
    buildCommand: python -m pip install --no-cache-dir -r requirements-render.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: CORS_ORIGINS
        sync: false
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
